# fw-navi32.lock: the linux-firmware amdgpu/ files the Navi 32 (RX 7800 XT / RX 7700 XT, 0x747e) bring-up
# loads, with the md5 of the revision this port was validated with. Same pinned commit as the Navi 31 lock
# (`linux-firmware-commit:` below); fetch with `tools/firmware/fetch_firmware.sh --lock fw-navi32.lock ~/gpu/fw/navi32`.
#
# The file set comes from RedNavi's verified list for this exact card (RedNavi/asic_navi32.cpp,
# docs/ARCHITECTURE.md "Firmware for this card"), and every md5 below was taken from the pinned commit on
# 2026-11-23. No *_kicker image: this board/rev does not need one.
#
# Two files are byte-identical to the Navi 31 set: dcn_3_2_0_dmcub.bin (DCN 3.2.0 is the same IP on both dies) and
# vcn_4_0_0.bin. The C3 PHY slice that tools/firmware/c3_image.py extracts from the DCN file is therefore unchanged,
# so phx_c3_image.inc does not have to be regenerated for Navi 32.
# linux-firmware-commit: add225168d0d1ba4c174d5eb15272b53de01ad5a
